name: Publish Wiki

on:
  push:
    branches:
      - main
    paths:
      - "wiki/**"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source repository
        uses: actions/checkout@v4
        with:
          path: source

      - name: Check out Wiki repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki-live
          token: ${{ github.token }}

      - name: Mirror Wiki source
        shell: bash
        run: |
          find wiki-live -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a source/wiki/. wiki-live/

      - name: Publish changes
        shell: bash
        run: |
          cd wiki-live
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Sync Wiki from main"
          git push
